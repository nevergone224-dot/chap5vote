<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂投票 - 全面预算与管理导向</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #1a237e;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .header .subtitle {
            color: #666;
            font-size: 14px;
        }
        .vote-card {
            background: #f8f9ff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border-left: 4px solid #667eea;
        }
        .vote-card h2 {
            font-size: 17px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .vote-card .highlight {
            color: #e53935;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.15);
        }
        .option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .option .letter {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 14px;
            flex-shrink: 0;
        }
        .option .text {
            font-size: 15px;
            color: #333;
            flex: 1;
        }
        .option .check {
            width: 24px;
            height: 24px;
            border: 2px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .option.selected .check {
            background: #667eea;
            border-color: #667eea;
        }
        .option.selected .check::after {
            content: "✓";
            color: white;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .result-title {
            text-align: center;
            color: #1a237e;
            font-size: 20px;
            margin-bottom: 24px;
        }
        .result-item {
            margin-bottom: 18px;
        }
        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }
        .result-bar-bg {
            height: 28px;
            background: #f0f0f0;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        .result-bar {
            height: 100%;
            border-radius: 14px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 1s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .result-bar.highlight {
            background: linear-gradient(90deg, #f093fb, #f5576c);
        }
        .total-votes {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 20px;
        }
        .back-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #f0f3ff;
        }
        .teacher-tip {
            background: #fff3e0;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 20px;
            font-size: 13px;
            color: #e65100;
            line-height: 1.5;
        }
        .teacher-tip strong {
            color: #bf360c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗳️ 课堂实时投票</h1>
            <p class="subtitle">第四章 · 全面预算与管理导向</p>
        </div>

        <div id="voteSection" class="vote-section">
            <div class="vote-card">
                <h2>青岚智能家电公司今年<span class="highlight">利润压力很大</span>，财务部门提出要压缩预算。你认为以下哪类预算<span class="highlight">最应该优先压缩</span>？</h2>
                <div class="options">
                    <div class="option" data-value="A" onclick="selectOption(this)">
                        <div class="letter">A</div>
                        <div class="text">智能产品研发预算</div>
                        <div class="check"></div>
                    </div>
                    <div class="option" data-value="B" onclick="selectOption(this)">
                        <div class="letter">B</div>
                        <div class="text">员工培训预算</div>
                        <div class="check"></div>
                    </div>
                    <div class="option" data-value="C" onclick="selectOption(this)">
                        <div class="letter">C</div>
                        <div class="text">高管差旅接待费用</div>
                        <div class="check"></div>
                    </div>
                    <div class="option" data-value="D" onclick="selectOption(this)">
                        <div class="letter">D</div>
                        <div class="text">售后服务系统建设预算</div>
                        <div class="check"></div>
                    </div>
                </div>
            </div>
            <button class="submit-btn" id="submitBtn" onclick="submitVote()" disabled>提交投票</button>
            <div class="teacher-tip">
                <strong>💡 提示：</strong>本投票为课堂互动使用。由于纯前端限制，数据存储在本地浏览器。教师可在投影端刷新页面查看汇总结果，或让学生举手后手动输入统计。
            </div>
        </div>

        <div id="resultSection" class="result-section">
            <h2 class="result-title">📊 投票结果</h2>
            <div id="results"></div>
            <p class="total-votes" id="totalVotes"></p>
            <button class="back-btn" onclick="resetVote()">重新投票</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'budget_vote_data_v1';
        let selectedValue = null;

        function initData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                const initial = { A: 0, B: 0, C: 0, D: 0, total: 0 };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            }
        }

        function selectOption(el) {
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            selectedValue = el.dataset.value;
            document.getElementById('submitBtn').disabled = false;
        }

        function submitVote() {
            if (!selectedValue) return;
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
            data[selectedValue]++;
            data.total++;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            showResults();
        }

        function showResults() {
            document.getElementById('voteSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
            const labels = {
                A: '智能产品研发预算',
                B: '员工培训预算', 
                C: '高管差旅接待费用',
                D: '售后服务系统建设预算'
            };
            let html = '';
            const maxVal = Math.max(data.A, data.B, data.C, data.D);
            ['A', 'B', 'C', 'D'].forEach((key) => {
                const count = data[key];
                const percent = data.total > 0 ? Math.round((count / data.total) * 100) : 0;
                const isMax = count === maxVal && count > 0;
                html += `
                    <div class="result-item">
                        <div class="result-label">
                            <span><strong>${key}.</strong> ${labels[key]}</span>
                            <span>${count} 票 (${percent}%)</span>
                        </div>
                        <div class="result-bar-bg">
                            <div class="result-bar ${isMax ? 'highlight' : ''}" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('results').innerHTML = html;
            document.getElementById('totalVotes').textContent = `共 ${data.total} 人参与投票`;
        }

        function resetVote() {
            selectedValue = null;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('voteSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
        }

        initData();
        if (window.location.search.includes('result=1')) {
            showResults();
            document.getElementById('voteSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.querySelector('.back-btn').style.display = 'none';
        }
    </script>
</body>
</html>
